name: Promote Environment Branch

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  promote:
    name: Promote approved environment
    if: >
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'robsonejsoares' &&
      (
        (github.event.pull_request.base.ref == 'test' &&
         github.event.pull_request.head.ref == 'develop') ||
        (github.event.pull_request.base.ref == 'staging' &&
         github.event.pull_request.head.ref == 'test') ||
        (github.event.pull_request.base.ref == 'main' &&
         github.event.pull_request.head.ref == 'staging')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Validar PR
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$TARGET_BRANCH" in
            test)
              [[ "$SOURCE_BRANCH" == "develop" ]] || exit 1
              ;;
            staging)
              [[ "$SOURCE_BRANCH" == "test" ]] || exit 1
              ;;
            main)
              [[ "$SOURCE_BRANCH" == "staging" ]] || exit 1
              ;;
            *)
              echo "Destino inválido."
              exit 1
              ;;
          esac

      - name: Criar token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SMART_CLIN_APP_ID }}
          private-key: ${{ secrets.SMART_CLIN_APP_PRIVATE_KEY }}

      - name: Verificar checks do PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          echo "Verificando checks do PR #$PR_NUMBER..."

          checks="$(gh pr checks "$PR_NUMBER" \
            --repo "$OWNER/$REPO" \
            --json name,state \
            --jq '[.[] | select(.name == "build-and-test")] | last // empty')"

          if [[ -z "$checks" ]]; then
            echo "Não foi encontrado o check build-and-test."
            exit 1
          fi

          state="$(printf '%s' "$checks" | jq -r '.state')"

          echo "build-and-test: $state"

          if [[ "$state" != "SUCCESS" ]]; then
            echo "CI não está aprovado."
            exit 1
          fi

          echo "CI aprovado."

      - name: Promover por fast-forward
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          echo "Promovendo:"
          echo "  $SOURCE_BRANCH"
          echo "        ↓"
          echo "  $TARGET_BRANCH"
          echo "SHA: $SOURCE_SHA"

          gh api \
            --method PATCH \
            "/repos/$OWNER/$REPO/git/refs/heads/$TARGET_BRANCH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f sha="$SOURCE_SHA" \
            -F force=false

          echo "Promoção concluída."

      - name: Confirmar SHA
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          source_sha="$(gh api \
            "/repos/$OWNER/$REPO/git/ref/heads/$SOURCE_BRANCH" \
            --jq '.object.sha')"

          target_sha="$(gh api \
            "/repos/$OWNER/$REPO/git/ref/heads/$TARGET_BRANCH" \
            --jq '.object.sha')"

          echo "Origem : $source_sha"
          echo "Destino: $target_sha"

          if [[ "$source_sha" != "$target_sha" ]]; then
            echo "ERRO: SHAs diferentes."
            exit 1
          fi

          echo "SHA confirmado: $target_sha"

      - name: Fechar PR promovido
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr close "$PR_NUMBER" \
            --repo "$OWNER/$REPO" \
            --comment "Promoção concluída automaticamente por fast-forward para $TARGET_BRANCH."

          echo "PR promovido fechado."

      - name: Criar próximo Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ github.event.pull_request.base.ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          case "$SOURCE_BRANCH" in
            test)
              NEXT_TARGET="staging"
              ;;
            staging)
              NEXT_TARGET="main"
              ;;
            main)
              echo "Chegou em main. Não existe próximo PR."
              exit 0
              ;;
            *)
              echo "Origem inválida: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          existing_pr="$(gh pr list \
            --repo "$OWNER/$REPO" \
            --head "$SOURCE_BRANCH" \
            --base "$NEXT_TARGET" \
            --state open \
            --json number \
            --jq 'length')"

          if [[ "$existing_pr" -gt 0 ]]; then
            echo "PR $SOURCE_BRANCH -> $NEXT_TARGET já existe."
            exit 0
          fi

          gh pr create \
            --repo "$OWNER/$REPO" \
            --base "$NEXT_TARGET" \
            --head "$SOURCE_BRANCH" \
            --title "Promote $SOURCE_BRANCH -> $NEXT_TARGET" \
            --body "Promoção automática do ambiente $SOURCE_BRANCH para $NEXT_TARGET. SHA promovido: ${{ github.event.pull_request.head.sha }}. Aguardando aprovação de robsonejsoares." \
            --reviewer robsonejsoares

          echo "Próximo PR criado: $SOURCE_BRANCH -> $NEXT_TARGET"